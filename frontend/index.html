<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Viewport accessible allowing zoom for Bible reading & proper mobile sizing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F0F" />
    <meta name="description" content="De conocer sobre Jesús, a conocer a Jesús. Plataforma comunitaria del grupo juvenil Íntimos." />

    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA meta & touch icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Íntimos" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <title>Íntimos — De Cerca</title>
  </head>
  <body class="bg-bg text-text-primary antialiased selection:bg-accent selection:text-white min-h-dvh">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[PWA] Service Worker registrado con éxito:', reg.scope);
          }).catch((err) => {
            console.warn('[PWA] Error al registrar Service Worker:', err);
          });
        });
      }
    </script>
  </body>
</html>
